{{ block title }}
Development setup
{{ endblock }}

{{ block content }}
<link rel="stylesheet" href="{{ static 'global/card_stacking.css' }}">

<div class="cs-setup">
    <div class="cs-debug-notice">
        Development-only experimenter setup. Do not show this page in the
        production experiment or to participants.
    </div>

    <div class="cs-debug-panel">
        <h4>Task parameters</h4>
        {{ formfields }}
    </div>

    {{ next_button }}
</div>

<script>
    (function () {
        const durationInput = document.getElementById('id_setup_duration_minutes');
        const showClickFeedbackInput = document.getElementById('id_setup_show_click_feedback');
        const mainBonusDelayInput = document.getElementById('id_setup_main_bonus_feedback_ms');
        const thresholdInput = document.getElementById('id_setup_bonus_threshold_main_cards');
        const pointsInput = document.getElementById('id_setup_main_bonus_points');
        if (!durationInput || !thresholdInput || !pointsInput) {
            return;
        }

        const thresholdPerMinute = 55;
        const pointsPerMainCard = 30;
        const defaultMainBonusDelay = 1000;
        let thresholdOverridden = false;
        let pointsOverridden = false;

        if (showClickFeedbackInput && !showClickFeedbackInput.dataset.defaultApplied) {
            showClickFeedbackInput.checked = true;
            showClickFeedbackInput.dataset.defaultApplied = 'true';
        }

        if (mainBonusDelayInput && !mainBonusDelayInput.value) {
            mainBonusDelayInput.value = defaultMainBonusDelay;
        }

        function formatNumber(value) {
            return Number.isInteger(value) ? String(value) : value.toFixed(1);
        }

        function defaultThreshold() {
            const duration = Number(durationInput.value || 0);
            return Math.max(1, Math.round(duration * thresholdPerMinute));
        }

        function defaultPoints() {
            const threshold = Number(thresholdInput.value || 0);
            return Math.max(0, threshold * pointsPerMainCard);
        }

        function setDefaultThresholdAndPoints() {
            if (!thresholdOverridden) {
                thresholdInput.value = defaultThreshold();
            }
            if (!pointsOverridden) {
                pointsInput.value = formatNumber(defaultPoints());
            }
        }

        setDefaultThresholdAndPoints();

        durationInput.addEventListener('input', () => {
            setDefaultThresholdAndPoints();
        });

        thresholdInput.addEventListener('input', () => {
            thresholdOverridden = true;
            if (!pointsOverridden) {
                pointsInput.value = formatNumber(defaultPoints());
            }
        });

        pointsInput.addEventListener('input', () => {
            pointsOverridden = true;
        });
    })();
</script>
{{ endblock }}
