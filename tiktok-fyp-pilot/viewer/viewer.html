<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Personalized video viewer</title>
    <link rel="stylesheet" href="../ui/common.css">
    <link rel="stylesheet" href="viewer.css">
</head>
<body>
    <main class="viewer-shell">
        <header class="viewer-header">
            <div>
                <p class="eyebrow">Research viewer</p>
                <h1>Your reserved videos</h1>
            </div>
            <div id="counter" class="viewer-counter" aria-live="polite"></div>
        </header>

        <div id="notice" class="notice" role="status" hidden></div>

        <section id="locked" class="card state-card" hidden>
            <h2>The viewer is still locked</h2>
            <p id="locked-message" class="muted"></p>
        </section>

        <section id="viewer" class="viewer-layout" aria-label="Personalized video feed" hidden>
            <div class="player-frame">
                <div id="player-mount" class="player-mount"></div>
                <div id="player-placeholder" class="player-placeholder">
                    <div class="placeholder-mark" aria-hidden="true">▶</div>
                    <p>Preparing the TikTok embed…</p>
                </div>
            </div>
            <div class="viewer-controls" role="group" aria-label="Video controls">
                <button id="previous" class="nav-button" type="button" aria-label="Previous video">←</button>
                <div class="status-copy" aria-live="polite">
                    <span class="eyebrow">Video <span id="video-number"></span></span>
                    <strong id="video-title">Ready to watch</strong>
                    <span id="video-status">Press Play to begin.</span>
                </div>
                <button id="play" class="play-button" type="button" disabled>Play</button>
                <button id="next" class="nav-button" type="button" aria-label="Next video">→</button>
                <button id="retry" class="retry-button" type="button" hidden>Retry save</button>
            </div>
            <p class="viewer-hint">Use ←/→, ↑/↓, or the mouse wheel to move. Space pauses or resumes.</p>
        </section>

        <section id="complete" class="card state-card" hidden>
            <div class="complete-mark" aria-hidden="true">✓</div>
            <h2>Viewer complete</h2>
            <p class="muted">Every valid reserved video has been presented.</p>
            <button id="open-inspector" class="secondary" type="button">Review local data</button>
        </section>
    </main>
    <script src="../lib/core.js"></script>
    <script src="viewer.js"></script>
</body>
</html>
